<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suno 批量下载助手</title><link rel="stylesheet" href="style.css"><main><header><span class="mark">♫</span><div><h1>Suno 批量下载助手</h1><p>把歌曲整理成队列，一次开始，逐首确认完成。</p></div></header><section class="import"><label for="links">歌曲链接、歌曲 ID 或歌单链接 · 每行一个</label><textarea id="links" rows="5" placeholder="https://suno.com/song/…&#10;https://suno.com/playlist/…"></textarea><div class="actions"><button id="import">加入队列</button><button id="collect" class="secondary">收集 Suno 页面歌曲</button><span id="notice" role="status"></span></div><p class="hint">收集的是页面当前加载的歌曲。回到 Suno 向下滚动，再收集即可追加，重复歌曲自动跳过。歌单解析服务可能只返回前 50 首。</p></section><section class="queue"><div class="toolbar"><h2>下载清单 <span id="count">0</span></h2><div class="actions"><label>同时下载 <select id="concurrency"><option>1</option><option selected>2</option><option>3</option></select> 首</label><button id="start">开始下载</button><button id="pause" class="secondary">暂停</button><button id="retry" class="secondary">重试失败</button><button id="clear" class="secondary">清除已完成</button></div></div><p id="summary" role="status"></p><div class="table-wrap"><table><thead><tr><th>歌曲</th><th>状态</th><th>进度</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty">先粘贴链接，或从 Suno 页面收集歌曲。</p></section><footer>保存为 M4A，文件位于 Downloads / SunoBatch。解析服务：download.ai-suno.com。无需提供账号 Cookie。请保持此标签页打开；暂停不会取消已经开始的下载。</footer></main><script src="app.js" type="module"></script></html>
